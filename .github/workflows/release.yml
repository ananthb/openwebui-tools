name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: seafile-bridge image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/seafile-bridge
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: release artifacts
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        run: |
          set -eu
          mkdir -p dist/tools dist/container
          cp tools/*.py dist/tools/
          cp container/bridge.py container/Dockerfile dist/container/
          cp LICENSE README.md dist/
          (cd dist && zip -qr "../openwebui-tools-${GITHUB_REF_NAME}.zip" .)
          ls -R dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            openwebui-tools-${{ github.ref_name }}.zip
            tools/*.py
            container/bridge.py
            container/Dockerfile
